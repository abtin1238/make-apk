
name: Apk to realse

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'ZIP path in repository (empty = build repository directly)'
        required: false
        default: ''

      flutter_version:
        description: 'Flutter version (empty = latest stable)'
        required: false
        default: ''

      publish_release:
        description: 'Also attach APK and ZIP to GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Find and unzip project
        id: src
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          ZIP="$ZIP_INPUT"

          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"

          if [ -n "$ZIP" ]; then
            [ -f "$ZIP" ] || {
              echo "::error::ZIP not found: $ZIP"
              exit 1
            }

            echo "Building from ZIP: $ZIP"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            ROOT="$RUNNER_TEMP/src"
            NAME="$(basename "$ZIP" .zip)"
          else
            echo "Building repository directly"
            ROOT="$GITHUB_WORKSPACE"
            NAME="repository"
          fi

          PUB="$(find "$ROOT" -maxdepth 5 \
            -name pubspec.yaml \
            -not -path '*/packages/*' \
            -not -path '*/.dart_tool/*' \
            | awk '{print length, $0}' \
            | sort -n \
            | head -1 \
            | cut -d' ' -f2-)"

          [ -n "$PUB" ] || {
            echo "::error::pubspec.yaml not found"
            exit 1
          }

          echo "dir=$(dirname "$PUB")" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Android SDK licenses and platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools" >/dev/null || true

      - name: Prepare Android project
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          FLUTTER_ROOT_DIR="$(dirname "$(dirname "$(which flutter)")")"

          mkdir -p android

          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "flutter.sdk=$FLUTTER_ROOT_DIR"
          } > android/local.properties

          chmod +x android/gradlew || true

          mkdir -p android/keystore

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using repository signing key"

            echo "$KEYSTORE_BASE64" | base64 -d \
              > android/keystore/ci-release.jks

            cat > android/key.properties <<PROPS
          storeFile=keystore/ci-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          PROPS

          elif [ -f android/key.properties ] && \
               grep -q '^storeFile=' android/key.properties && \
               [ -f "android/$(grep '^storeFile=' android/key.properties | cut -d= -f2)" ]; then

            echo "Using project signing key"

          else
            echo "::warning::Generating temporary signing key"

            keytool -genkeypair -v \
              -keystore android/keystore/ci-release.jks \
              -storepass android \
              -keypass android \
              -alias ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Abtin CI" >/dev/null 2>&1

            printf 'storeFile=keystore/ci-release.jks\nstorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' \
              > android/key.properties
          fi

      - name: Get dependencies
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.src.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect APK and create ZIP
        id: output
        shell: bash
        env:
          APP_NAME: ${{ steps.src.outputs.name }}
          PROJECT_DIR: ${{ steps.src.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          [ -f "$APK" ] || {
            echo "::error::APK was not generated"
            exit 1
          }

          mkdir -p dist

          cp "$APK" "dist/${APP_NAME}.apk"

          cd dist
          zip -q "${APP_NAME}-apk.zip" "${APP_NAME}.apk"

          echo "apk=dist/${APP_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "zip=dist/${APP_NAME}-apk.zip" >> "$GITHUB_OUTPUT"

          ls -lh

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.src.outputs.name }}-build
          path: |
            ${{ steps.output.outputs.apk }}
            ${{ steps.output.outputs.zip }}
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.src.outputs.name }}
          files: |
            ${{ steps.output.outputs.apk }}
            ${{ steps.output.outputs.zip }}
