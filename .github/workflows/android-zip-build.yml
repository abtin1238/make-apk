name: Apk to release (arm64 / armv7 / x86_64)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Gradle project
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          F="$(find . -maxdepth 3 -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)"
          [ -n "$F" ] || { echo "::error::settings.gradle.kts not found"; exit 1; }
          DIR="$(dirname "$F")"
          echo "Gradle project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: do NOT request the legacy 'tools' package (it no longer exists and made the old build fail)
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # The wrapper jar in the repo is a stub, so use a real Gradle distribution instead of ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APKs (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package one ZIP per APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          [ ${#APKS[@]} -gt 0 ] || { echo "::error::No APK was produced"; exit 1; }
          for apk in "${APKS[@]}"; do
            b="$(basename "$apk" .apk)"
            zip -9 -X -j "$GITHUB_WORKSPACE/out/${b}.zip" "$apk"
          done
          ls -lh "$GITHUB_WORKSPACE/out"

      # Artifact name must match the release workflow pattern '*-build-*'
      - uses: actions/upload-artifact@v4
        with:
          name: AbtinSMS-build-${{ github.run_number }}
          path: out/*.zip
          compression-level: 0
          if-no-files-found: error
