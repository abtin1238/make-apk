name: android-zip-build
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Path of the project zip inside the repo"
        default: "AbtinSMS.zip"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unzip and locate Gradle project
        id: p
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "${{ inputs.zip }}" -d "$RUNNER_TEMP/src"
          S="$(find "$RUNNER_TEMP/src" -maxdepth 4 -name settings.gradle.kts -o -maxdepth 4 -name settings.gradle | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)"
          [ -n "$S" ] || { echo "::error::settings.gradle(.kts) not found"; exit 1; }
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
