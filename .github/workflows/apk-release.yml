name: Build APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "تگ ریلیز (مثلاً v1.0.0)"
        required: true
      display_names:
        description: "نام نمایشی، جداشده با کاما و هم‌ترتیب با زیپ‌ها (خالی = اسم زیپ)"
        required: false
      zips:
        description: "مسیر زیپ‌ها در ریپو یا لینک http؛ با کاما یا خط جدید جدا کن"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ZIPS: ${{ inputs.zips }}
          NAMES: ${{ inputs.display_names }}
        run: |
          python3 - <<'EOF'
          import json, os
          zips  = [z.strip() for z in os.environ['ZIPS'].replace('\n', ',').split(',') if z.strip()]
          names = [n.strip() for n in os.environ['NAMES'].split(',') if n.strip()]
          inc = []
          for i, z in enumerate(zips):
              base = os.path.splitext(os.path.basename(z))[0]
              inc.append({"zip": z, "name": names[i] if i < len(names) else base, "id": base})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
          EOF

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      APP_NAME: ${{ matrix.name }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch and unzip project
        env:
          ZIP: ${{ matrix.zip }}
        run: |
          mkdir -p work
          if [[ "$ZIP" == http* ]]; then curl -fL "$ZIP" -o project.zip; else cp "$ZIP" project.zip; fi
          unzip -q project.zip -d work
          ROOT=$(find work -maxdepth 4 \( -name pubspec.yaml -o -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' \
                 | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$ROOT" ] || { echo "پروژه پیدا نشد"; exit 1; }
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          if [ -f "$ROOT/pubspec.yaml" ]; then echo "KIND=flutter" >> $GITHUB_ENV; else echo "KIND=native" >> $GITHUB_ENV; fi

      - name: Set display name (android:label)
        run: |
          SAFE=$(printf '%s' "$APP_NAME" | sed -e 's/[&/\]/\\&/g')
          for M in "$ROOT/android/app/src/main/AndroidManifest.xml" "$ROOT/app/src/main/AndroidManifest.xml"; do
            [ -f "$M" ] && sed -i -E "0,/android:label=\"[^\"]*\"/s//android:label=\"$SAFE\"/" "$M"
          done
          true

      - name: Prepare keystore + signing init script
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KS_PATH=$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASS=$KEY_PASSWORD"
          } >> $GITHUB_ENV
          [ "$KIND" = "native" ] && echo "ABI_SPLIT=1" >> $GITHUB_ENV
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/ci-sign.gradle <<'EOF'
          allprojects { p ->
            p.afterEvaluate {
              def a = p.extensions.findByName('android')
              if (a != null && p.plugins.hasPlugin('com.android.application')) {
                a.signingConfigs.create('ci') { c ->
                  c.storeFile = new File(System.getenv('KS_PATH'))
                  c.storePassword = System.getenv('KS_PASS')
                  c.keyAlias = System.getenv('KEY_ALIAS')
                  c.keyPassword = System.getenv('KEY_PASS')
                }
                a.buildTypes.release.signingConfig = a.signingConfigs.ci
                if (System.getenv('ABI_SPLIT') == '1') {
                  a.splits.abi {
                    enable = true
                    reset()
                    include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                    universalApk = false
                  }
                }
              }
            }
          }
          EOF

      - uses: subosito/flutter-action@v2
        if: env.KIND == 'flutter'
        with:
          channel: stable
          cache: true

      - name: Build (Flutter, split per ABI)
        if: env.KIND == 'flutter'
        working-directory: ${{ env.ROOT }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build (native Gradle)
        if: env.KIND == 'native'
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleRelease --no-daemon; else gradle assembleRelease --no-daemon; fi

      - name: Collect APKs
        run: |
          mkdir -p out
          SAFE=$(echo "$APP_NAME" | tr ' /' '__')
          find "$ROOT" -name '*.apk' -path '*release*' ! -name '*unsigned*' | while read f; do
            b=$(basename "$f")
            case "$b" in
              *arm64-v8a*)   abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*)      abi=x86_64 ;;
              *)             abi=universal ;;
            esac
            cp "$f" "out/${SAFE}-${TAG}-${abi}.apk"
          done
          ls -la out
          [ "$(ls out | wc -l)" -gt 0 ] || { echo "APK پیدا نشد"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.id }}
          path: out/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: out/*.apk
