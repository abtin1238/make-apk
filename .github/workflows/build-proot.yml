name: Build PRoot from source ZIP (arm64, static)

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "PRoot source ZIP path in this repository"
        required: true
        default: "v5_5_0_source_code.zip"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Write build script
        run: |
          cat > "$RUNNER_TEMP/build-proot.sh" <<'EOS'
          set -eu
          apk add --no-cache build-base linux-headers pkgconf talloc-dev uthash-dev unzip file binutils >/dev/null
          apk add --no-cache talloc-static >/dev/null 2>&1 || true
          rm -rf /tmp/pb && mkdir /tmp/pb && cd /tmp/pb
          unzip -q "/w/$ZIP_PATH"
          # accept a zip that contains another zip (e.g. the whole kit)
          for i in 1 2 3; do
            [ -n "$(find . -path '*/src/GNUmakefile' | head -n1)" ] && break
            for z in $(find . -name '*.zip'); do unzip -q -o "$z" -d "$(dirname "$z")/x$i" || true; done
          done
          MK=$(find . -path '*/src/GNUmakefile' | head -n1)
          [ -n "$MK" ] || { echo "ERROR: no PRoot source (src/GNUmakefile) inside $ZIP_PATH"; exit 1; }
          cd "$(dirname "$(dirname "$MK")")"
          pwd
          export WITHOUT_PYTHON=1
          make -C src clean loader.elf build.h WITHOUT_PYTHON=1
          LDFLAGS="-static" make -C src proot WITHOUT_PYTHON=1
          mkdir -p /w/out
          strip src/proot
          cp src/proot /w/out/libproot.so
          if [ -f src/loader.elf ]; then cp src/loader.elf /w/out/libproot-loader.so; else echo "no separate loader.elf"; fi
          file /w/out/libproot.so
          src/proot --version | head -3 || true
          echo "statx mentions: $(strings -a /w/out/libproot.so | grep -c statx || true)"
          ls -la /w/out
          EOS
      - name: Build in arm64 Alpine
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          [ -f "$ZIP_PATH" ] || { echo "::error::ZIP not found: $ZIP_PATH"; exit 1; }
          mkdir -p out
          docker run --rm --platform linux/arm64 -e ZIP_PATH -v "$PWD":/w -v "$RUNNER_TEMP/build-proot.sh":/build.sh:ro -w /w alpine:3.20 sh /build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64-static
          path: out/*
          if-no-files-found: error
