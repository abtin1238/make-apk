name: Build Release APKs from GitHub ZIP

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: Where the project ZIP is stored
        required: true
        type: choice
        options:
          - repository
          - release
        default: repository
      zip_path:
        description: Repository-relative ZIP path (repository mode; leave empty to auto-detect one ZIP)
        required: false
        type: string
      release_tag:
        description: GitHub Release tag (release mode)
        required: false
        type: string
      release_asset:
        description: Exact ZIP asset filename in that Release (release mode)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: android-arm
          - abi: arm64-v8a
            target: android-arm64
          - abi: x86
            target: android-x86
          - abi: x86_64
            target: android-x64

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download project ZIP from repository
        if: inputs.zip_source == 'repository'
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [[ -n "$ZIP_PATH" ]]; then
            [[ -f "$ZIP_PATH" ]] || { echo "::error::ZIP not found: $ZIP_PATH"; exit 1; }
            cp "$ZIP_PATH" "$RUNNER_TEMP/project-source.zip"
          else
            mapfile -t zips < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './.github/*' | sort)
            if [[ "${#zips[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one project ZIP in the repository, found ${#zips[@]}. Set the zip_path workflow input to its exact path."
              printf '%s\n' "${zips[@]}"
              exit 1
            fi
            cp "${zips[0]}" "$RUNNER_TEMP/project-source.zip"
          fi

      - name: Download project ZIP from GitHub Release
        if: inputs.zip_source == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET: ${{ inputs.release_asset }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TAG" ]] || { echo "::error::release_tag is required."; exit 1; }
          [[ -n "$RELEASE_ASSET" ]] || { echo "::error::release_asset is required."; exit 1; }
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          asset_id="$(jq -r --arg name "$RELEASE_ASSET" '.assets[] | select(.name == $name) | .id' <<< "$release_json" | head -n 1)"
          [[ -n "$asset_id" && "$asset_id" != "null" ]] || {
            echo "::error::Asset '$RELEASE_ASSET' was not found in release '$RELEASE_TAG'."
            exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" > "$RUNNER_TEMP/project-source.zip"
          unzip -tq "$RUNNER_TEMP/project-source.zip"

      - name: Extract ZIP and locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$RUNNER_TEMP/project-source.zip" -d "$RUNNER_TEMP/project"
          mapfile -t manifests < <(find "$RUNNER_TEMP/project" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | sort)
          project_dir=""
          for manifest in "${manifests[@]}"; do
            candidate="$(dirname "$manifest")"
            if [[ -d "$candidate/android" && -f "$candidate/android/app/build.gradle" || -d "$candidate/android" && -f "$candidate/android/app/build.gradle.kts" ]]; then
              project_dir="$candidate"
              break
            fi
          done
          if [[ -z "$project_dir" ]]; then
            echo "::error::No Flutter Android project (pubspec.yaml plus android/app/build.gradle or build.gradle.kts) was found inside the ZIP."
            echo "ZIP contents:"
            find "$RUNNER_TEMP/project" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Flutter project found: $project_dir"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ matrix.abi }}

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Release APK for ${{ matrix.abi }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --target-platform ${{ matrix.target }}

      - name: Package architecture ZIP
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$apk" ]] || { echo "::error::Expected APK was not produced: $apk"; exit 1; }
          mkdir -p "$RUNNER_TEMP/package"
          cp "$apk" "$RUNNER_TEMP/package/AbtinBrowser-${ABI}-release.apk"
          (
            cd "$RUNNER_TEMP/package"
            sha256sum "AbtinBrowser-${ABI}-release.apk" > SHA256SUMS.txt
            zip -q "AbtinBrowser-${ABI}-release.zip" "AbtinBrowser-${ABI}-release.apk" SHA256SUMS.txt
          )
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$RUNNER_TEMP/package/AbtinBrowser-${ABI}-release.zip" "$GITHUB_WORKSPACE/output/"

      - name: Upload architecture ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AbtinBrowser-${{ matrix.abi }}-release
          path: output/AbtinBrowser-${{ matrix.abi }}-release.zip
          if-no-files-found: error
          retention-days: 30
